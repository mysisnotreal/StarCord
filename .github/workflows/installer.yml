name: Build Installers
on:
    workflow_dispatch:

env:
    FORCE_COLOR: true

jobs:
    Build:
        name: Build installer (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # ubuntu-22.04 keeps the Linux build compatible with older distros
                os: [windows-latest, ubuntu-22.04, macos-latest]

        steps:
            - uses: actions/checkout@v7

            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install PyInstaller
              run: python -m pip install pyinstaller==6.16.0 pillow==11.1.0

            - name: Build Starcord and stage installer files
              run: python installer/build.py stage --no-restore

            - name: Package installer
              run: python installer/build.py package --out release

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: StarCordInstaller-${{ runner.os }}
                  path: release/*
